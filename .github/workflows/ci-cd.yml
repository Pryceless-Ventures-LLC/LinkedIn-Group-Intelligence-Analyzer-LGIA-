name: CI-CD

on:
  push:
    branches:
      - dev
      - preview
      - main
  pull_request:

jobs:
  # ---------------------------
  # Frontend: build & test only
  # (Deployment handled by Vercel's GitHub integration)
  # ---------------------------
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if present)
        run: npm test --if-present

      - name: Build frontend
        run: npm run build

  # ---------------------------
  # Backend: test, build Docker, push to ECR, deploy to ECS
  # ---------------------------
  backend-ci-cd:
    name: Backend CI/CD (Flask on AWS ECS)
    runs-on: ubuntu-latest
    needs: [frontend-ci] # only deploy backend if frontend passes

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }} # e.g. "watch-what-you-say-backend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Determine deploy environment from branch
      # dev     -> dev
      # preview -> preview
      # main    -> prod
      # -----------------------
      - name: Set deployment environment
        id: set-env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "DEPLOY_ENV=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "preview" ]]; then
            echo "DEPLOY_ENV=preview" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY_ENV=dev" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------
      # Backend tests (Python)
      # -----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (if any)
        working-directory: backend
        run: |
          if [ -d "tests" ]; then
            pytest -q || exit 1
          else
            echo "No tests directory found, skipping pytest."
          fi

      # -----------------------
      # Configure AWS credentials
      # -----------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------
      # Log in to Amazon ECR
      # -----------------------
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------
      # Build & push Docker image for backend
      # -----------------------
      - name: Build, tag, and push image to ECR
        id: build-image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          echo "Building image ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build -t ${ECR_REPOSITORY}:${IMAGE_TAG} ./backend
          docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      # -----------------------
      # Render ECS task definition with new image
      # You must commit a base task definition at:
      #   infra/task-definition.json
      # and ensure the container name matches "backend"
      # -----------------------
      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: backend
          image: ${{ steps.build-image.outputs.image }}

      # -----------------------
      # Deploy to the appropriate ECS service based on environment
      # Expects these secrets:
      #   AWS_ECS_CLUSTER_DEV / PREVIEW / PROD
      #   AWS_ECS_SERVICE_DEV / PREVIEW / PROD
      # -----------------------
      - name: Select ECS cluster and service
        id: select-ecs
        run: |
          if [[ "${{ steps.set-env.outputs.DEPLOY_ENV }}" == "prod" ]]; then
            echo "ECS_CLUSTER=${{ secrets.AWS_ECS_CLUSTER_PROD }}" >> "$GITHUB_OUTPUT"
            echo "ECS_SERVICE=${{ secrets.AWS_ECS_SERVICE_PROD }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.set-env.outputs.DEPLOY_ENV }}" == "preview" ]]; then
            echo "ECS_CLUSTER=${{ secrets.AWS_ECS_CLUSTER_PREVIEW }}" >> "$GITHUB_OUTPUT"
            echo "ECS_SERVICE=${{ secrets.AWS_ECS_SERVICE_PREVIEW }}" >> "$GITHUB_OUTPUT"
          else
            echo "ECS_CLUSTER=${{ secrets.AWS_ECS_CLUSTER_DEV }}" >> "$GITHUB_OUTPUT"
            echo "ECS_SERVICE=${{ secrets.AWS_ECS_SERVICE_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.select-ecs.outputs.ECS_SERVICE }}
          cluster: ${{ steps.select-ecs.outputs.ECS_CLUSTER }}
          wait-for-service-stability: true
